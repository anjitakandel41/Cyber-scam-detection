{% extends 'scanner/scan_base.html' %}

{% block scanner_form %}
<form method="post" class="scanner-form">
    {% csrf_token %}

    <div class="scanner-field">
        <label for="{{ form.content.id_for_label }}"></label>
        {{ form.content }}
        {% if form.content.errors %}
            <div class="field-error">{{ form.content.errors }}</div>
        {% endif %}
    </div>

    <button class="btn-scan-pro" type="submit">
        <i class="bi bi-link-45deg"></i>
        Scan URL
    </button>
</form>
{% endblock %}
