{% extends 'scanner/scan_base.html' %}

{% block scanner_form %}
<form method="post" enctype="multipart/form-data" class="scanner-form">
    {% csrf_token %}

    <div class="scanner-field">
        <label for="{{ form.qr_image.id_for_label }}">QR Image</label>
        {{ form.qr_image }}
        {% if form.qr_image.errors %}
            <div class="field-error">{{ form.qr_image.errors }}</div>
        {% endif %}
    </div>

    <button class="btn-scan-pro" type="submit">
        <i class="bi bi-qr-code-scan"></i>
        Decode and Scan
    </button>
</form>

{% if decode_error %}
    <div class="qr-decode-error">
        <strong>QR could not be decoded.</strong>
        <p>{{ decode_error }}</p>
    </div>
{% endif %}

<style>
    .qr-decode-error {
        margin-top: 18px;
        padding: 16px;
        border: 1px solid #F4B400;
        border-radius: 14px;
        background: #FFF8E1;
        color: #1A3A4A;
        font-weight: 600;
        line-height: 1.6;
    }

    .qr-decode-error strong {
        display: block;
        margin-bottom: 6px;
        color: #8A5A00;
        font-weight: 900;
    }

    .qr-decode-error p {
        margin: 0;
    }
</style>
{% endblock %}
