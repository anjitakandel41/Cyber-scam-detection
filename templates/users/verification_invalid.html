{% extends 'base.html' %}

{% block title %}Invalid Verification Link{% endblock %}

{% block content %}
<div class="content-container auth-wrap">
    <section class="auth-card text-center">
        <span class="icon-tile mb-3"><i class="bi bi-exclamation-triangle"></i></span>
        <h1 class="h3 fw-bold">Verification link invalid</h1>
        <p class="text-muted-soft">This email verification link is invalid or has already been used.</p>
        <a class="btn btn-cyber" href="{% url 'users:login' %}">Back to login</a>
    </section>
</div>
{% endblock %}
