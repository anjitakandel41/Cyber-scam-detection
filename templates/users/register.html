{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<section class="panel">
    <h1>Create account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p>Already registered? <a href="{% url 'users:login' %}">Log in</a>.</p>
</section>
{% endblock %}
