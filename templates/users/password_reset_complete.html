{% extends 'base.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="content-container auth-wrap">
    <section class="auth-card text-center">
        <span class="icon-tile mb-3"><i class="bi bi-check2-circle"></i></span>
        <h1 class="h3 fw-bold">Password updated</h1>
        <p class="text-muted-soft">Your password has been reset. You can now log in.</p>
        <a class="btn btn-cyber" href="{% url 'users:login' %}">Login</a>
    </section>
</div>
{% endblock %}
