{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<section class="panel">
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p><a href="{% url 'users:password_reset' %}">Forgot password?</a></p>
    <p>Need an account? <a href="{% url 'users:register' %}">Register</a>.</p>
</section>
{% endblock %}
