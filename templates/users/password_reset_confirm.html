{% extends 'base.html' %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<section class="panel">
    <h1>Set new password</h1>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Update password</button>
        </form>
    {% else %}
        <p>This password reset link is invalid or has expired.</p>
    {% endif %}
</section>
{% endblock %}
