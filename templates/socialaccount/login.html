{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue with Google</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* Background animations */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(46, 125, 50, 0.06);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            animation: floatBg 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(46, 125, 50, 0.04);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            animation: floatBg 6s ease-in-out infinite reverse;
        }

        @keyframes floatBg {
            0%, 100% {
                transform: scale(1) translate(0, 0);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2) translate(20px, -20px);
                opacity: 1;
            }
        }

        .background {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .card {
            width: 100%;
            max-width: 470px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 45px 40px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.08), 0 10px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn .5s ease;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.1), 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-circle {
            width: 85px;
            height: 85px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(46, 125, 50, 0.08);
            transition: all 0.3s ease;
        }

        .logo-circle:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(46, 125, 50, 0.15);
        }

        .logo-circle img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        h1 {
            margin-top: 5px;
            margin-bottom: 15px;
            color: #1b5e20;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            color: #546e7a;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        p strong {
            color: #1b5e20;
        }

        .google-btn {
            width: 100%;
            height: 58px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #2e7d32, #388e3c);
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(46, 125, 50, 0.2);
            position: relative;
            overflow: hidden;
        }

        .google-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .google-btn:hover::before {
            left: 100%;
        }

        .google-btn img {
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            padding: 2px;
            object-fit: contain;
        }

        .google-btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #1b5e20, #2e7d32);
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.35);
        }

        .google-btn:active {
            transform: scale(0.98);
        }

        .google-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .divider {
            margin: 35px 0 30px 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #c8e6c9, transparent);
            position: relative;
        }

        .divider::after {
            content: '🔒';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 0 15px;
            font-size: 14px;
        }

        .security {
            color: #2e7d32;
            font-weight: 600;
            margin-bottom: 25px;
            font-size: 15px;
            background: rgba(46, 125, 50, 0.05);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(46, 125, 50, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .cancel {
            text-decoration: none;
            color: #546e7a;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 10px;
            background: rgba(46, 125, 50, 0.03);
        }

        .cancel:hover {
            color: #2e7d32;
            background: rgba(46, 125, 50, 0.08);
            transform: translateX(-3px);
        }

        /* Loading spinner */
        .spinner-border-sm {
            width: 1.2rem;
            height: 1.2rem;
            border-width: 0.15em;
            animation: spin 0.75s linear infinite;
            border: 0.15em solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card {
                padding: 30px 20px;
                border-radius: 24px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 14px;
            }

            .google-btn {
                height: 52px;
                font-size: 15px;
            }

            .logo-circle {
                width: 70px;
                height: 70px;
            }

            .logo-circle img {
                width: 38px;
                height: 38px;
            }

            .security {
                font-size: 13px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

<div class="background">
    <div class="card">

        <div class="logo-circle">
            <img src="{% static 'images/google-logo.webp' %}" alt="Google">
        </div>

        <h1>Continue with Google</h1>

        <p>
            You're about to sign in securely using your Google account.
            Your password is never shared with <strong>ScamShield AI</strong>.
        </p>

        <form method="post" id="googleForm">
            {% csrf_token %}

            <button type="submit" class="google-btn" id="googleBtn">
                <img src="{% static 'images/google-logo.webp' %}" alt="Google">
                Continue with Google
            </button>
        </form>

        <div class="divider"></div>

        <div class="security">
            <i class="bi bi-shield-lock-fill"></i>
            Protected by Google OAuth 2.0
        </div>

        <a href="{% url 'users:login' %}" class="cancel">
            <i class="bi bi-arrow-left"></i>
            Back to Login
        </a>

    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('googleForm');
    const btn = document.getElementById('googleBtn');

    form.addEventListener('submit', function(e) {
        // Disable button and show loading state
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border-sm"></span> Signing in...';
    });
});
</script>

</body>
</html>
